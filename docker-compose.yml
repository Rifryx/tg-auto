services:
  postgres:
    image: postgres:16-alpine
    container_name: neuro_postgres
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres_test:
    image: postgres:16-alpine
    container_name: neuro_postgres_test
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro
      POSTGRES_DB: neuro_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuro -d neuro_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
