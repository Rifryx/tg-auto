name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuro
          POSTGRES_PASSWORD: neuro
          POSTGRES_DB: neuro_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U neuro -d neuro_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://neuro:neuro@localhost:5433/neuro_test
      TEST_REDIS_URL: redis://localhost:6380/1
      DEV_MODE: "true"
      ENCRYPTION_KEY: "yWNCwxk9pQfP1Q9ONFvsUpP2QGyLBc5aQvj9k4vX_9M="

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
