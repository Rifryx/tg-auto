# nginx для Mini App: статика + прокси /api/* на api-сервис (один origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API через тот же origin → нет CORS, initData-заголовки доходят как есть.
    # Трейлинг-слэш срезает префикс: /api/monitoring/dashboard → api:8000/monitoring/dashboard
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (/api/monitoring/stream, /api/accounts/{id}/login/stream): без буфера
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA: любой маршрут отдаёт index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
