# nginx для Mini App: статика + прокси /api/* на api-сервис (один origin).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS (127.0.0.11 на user-defined сетях, которые и создаёт
    # compose). Нужен, чтобы nginx НЕ кэшировал IP api навсегда: bare-hostname
    # в proxy_pass резолвится один раз при старте worker-процесса nginx и
    # больше никогда не обновляется, пока nginx не перезапустят. Если api
    # пересоздать (docker compose up --force-recreate api / --build api) без
    # перезапуска frontend, контейнер получает новый внутренний IP — nginx
    # продолжает стучаться в старый и отдаёт "502 Bad Gateway" / "Connection
    # refused" на все /api/* запросы (реальный инцидент). С resolver + $-переменной
    # в proxy_pass nginx резолвит hostname заново на каждый запрос (с учётом TTL).
    resolver 127.0.0.11 valid=10s;

    # API через тот же origin → нет CORS, initData-заголовки доходят как есть.
    location /api/ {
        # ВАЖНО: переменная в proxy_pass (нужна для динамического resolver'а
        # выше) отключает автообрезание префикса location самим nginx — делаем
        # это явно через rewrite...break. Порядок директив критичен: set — ДО
        # rewrite...break, не после. rewrite с флагом break останавливает
        # дальнейшую обработку директив rewrite-модуля (к которому относится и
        # set) в этом location — если set стоит после break, он никогда не
        # выполнится, и proxy_pass получит пустую переменную → "invalid URL
        # prefix" (проверено вручную: именно так и сломалось при первой
        # попытке этого фикса).
        # /api/monitoring/dashboard → /monitoring/dashboard → api:8000/monitoring/dashboard
        set $api_upstream api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        # Загрузка медиа (POST /api/media-assets) — до 25 МБ, как и лимит бэкенда
        # (media_assets._MAX_BYTES). Без этого nginx режет тело на дефолтном 1 МБ
        # → фото часто не грузятся (413). Держим в синхроне с бэкендом.
        client_max_body_size 25m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (/api/monitoring/stream, /api/accounts/{id}/login/stream): без буфера
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA: любой маршрут отдаёт index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
