[project]
name = "neuro-commenting"
version = "0.1.0"
description = "Neuro-commenting: Telegram user-account library with LLM comment automation."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "cryptography>=43.0",
    "arq>=0.26",
    "structlog>=24.1",
    "telethon>=1.36",
    "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-postgresql>=6.1.1",
    "fakeredis>=2.20",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
